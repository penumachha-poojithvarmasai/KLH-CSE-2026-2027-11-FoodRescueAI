server:
  port: 8083

spring:
  application:
    name: evidence-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/courierproof_evidence?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:courierproof-super-secret-jwt-key-for-hackathon-2024-very-long}

evidence:
  upload-dir: uploads/evidence

management:
  endpoints:
    web:
      exposure:
        include: health,info

